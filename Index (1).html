*{
  box-sizing:border-box
}

html{
  scrollbar-color:#263451 #0a0e17;
  overflow-x:clip;
  -webkit-text-size-adjust:100%
}

html,body{
  max-width:100%
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Prompt,Kanit,"Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;
  overflow-x:clip;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  min-height:44px
}

button:active{
  transform:translateY(1px) scale(.99)
}

button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px
}

input,select{
  touch-action:manipulation
}

input[type="range"]{
  touch-action:pan-x
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#263451;
  border-radius:99px
}

::-webkit-scrollbar-track{
  background:transparent
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.glow-green{
  box-shadow:0 0 0 1px rgba(0,230,138,.25),0 16px 44px rgba(0,230,138,.10)
}

.glow-active{
  box-shadow:0 0 0 1px rgba(245,200,110,.45),0 0 22px rgba(245,200,110,.18)
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.78)
  }
}

@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes tickerMove{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes progressSlide{
  from{
    width:0%
  }

  to{
    width:100%
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(12px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.rise{
  animation:riseIn .45s ease both
}

.live-dot{
  animation:pulseDot 1.6s ease-in-out infinite
}

.ticker-track{
  animation:tickerMove 32s linear infinite
}

.ticker-track:hover{
  animation-play-state:paused
}

.car-cluster{
  background:radial-gradient(120% 130% at 50% 0%,#1a2438 0%,#0b111f 52%,#070b14 100%)
}

.car-gauge-face{
  background:radial-gradient(circle at 50% 22%,#2a3854 0%,#101827 46%,#070b14 100%)
}

.car-needle{
  filter:drop-shadow(0 0 4px rgba(255,255,255,.7))
}

.car-gauge-needle{
  transition:transform .9s cubic-bezier(.22,1,.36,1);
  will-change:transform
}

.gauge-no-select{
  -webkit-user-select:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation
}

.app-shell{
  min-height:100vh;
  min-height:100dvh
}

.app-layout{
  display:grid;
  gap:1.5rem;
  grid-template-columns:minmax(0,1fr);
  min-width:0
}

/* Breathing room + hover glow: cards lift on hover without layout shift. */

.card-hover{
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease
}

.card-hover:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 34px rgba(0,0,0,.32),0 0 0 1px rgba(245,200,110,.14);
  border-color:#2b3a57
}

@keyframes priceUp{
  0%{
    background-color:rgba(0,230,138,.22)
  }

  100%{
    background-color:transparent
  }
}

@keyframes priceDown{
  0%{
    background-color:rgba(255,77,109,.22)
  }

  100%{
    background-color:transparent
  }
}

.price-up{
  animation:priceUp 1.1s ease-out both;
  border-radius:.5rem
}

.price-down{
  animation:priceDown 1.1s ease-out both;
  border-radius:.5rem
}

.section-title{
  display:flex;
  align-items:center;
  gap:.6rem
}

@media (min-width:769px) and (max-width:1024px){
  .app-layout{
    grid-template-columns:250px minmax(0,1fr)
  }

  .app-right{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.25rem;
    align-items:start
  }

  .app-right>*+*{
    margin-top:0!important
  }
}

@media (min-width:1025px) and (max-width:1366px){
  .app-layout{
    grid-template-columns:248px minmax(0,1fr) 308px;
    gap:1.5rem
  }
}

@media (min-width:1367px){
  .app-layout{
    grid-template-columns:264px minmax(0,1fr) 332px;
    gap:1.75rem
  }
}

.risk-range{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  accent-color:#f5c86e;
  height:44px;
  background:transparent;
  width:100%
}

.risk-range::-webkit-slider-runnable-track{
  height:8px;
  border-radius:99px;
  background:linear-gradient(90deg,#00e68a,#f5c86e,#ff4d6d)
}

.risk-range::-moz-range-track{
  height:8px;
  border-radius:99px;
  background:linear-gradient(90deg,#00e68a,#f5c86e,#ff4d6d)
}

.risk-range::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#fff;
  border:4px solid #f5c86e;
  margin-top:-10px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
  cursor:pointer
}

.risk-range::-moz-range-thumb{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  border:4px solid #f5c86e;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
  cursor:pointer
}

.top-progress{
  height:3px;
  background:linear-gradient(90deg,#00e68a,#f5c86e);
  animation:progressSlide 2.2s cubic-bezier(.22,1,.36,1) forwards
}

.toast-in{
  animation:toastIn .28s ease both
}

@keyframes slFlash{
  0%,100%{
    background-color:rgba(255,77,109,.28);
    box-shadow:0 0 0 1px rgba(255,77,109,.7)
  }

  50%{
    background-color:rgba(255,77,109,.08);
    box-shadow:0 0 0 1px rgba(255,77,109,.25)
  }
}

.sl-flash{
  animation:slFlash .9s ease-in-out infinite
}

.mode-buy-active{
  background:var(--green)!important;
  color:#04110b!important;
  box-shadow:0 0 0 2px rgba(0,230,138,.55),0 0 28px rgba(0,230,138,.45)!important
}

.mode-sell-active{
  background:var(--red)!important;
  color:#fff!important;
  box-shadow:0 0 0 2px rgba(255,77,109,.55),0 0 28px rgba(255,77,109,.45)!important
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
}

.placeholder\:text-\[var\(--muted-2\)\]::-moz-placeholder {
  color: var(--muted-2);
}

.placeholder\:text-\[var\(--muted-2\)\]::placeholder {
  color: var(--muted-2);
}

.last\:border-0:last-child {
  border-width: 0px;
}

.last\:pb-0:last-child {
  padding-bottom: 0px;
}

.hover\:bg-\[\#26334d\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(38 51 77 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[var\(--surface\)\]:hover {
  background-color: var(--surface);
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

.hover\:text-\[var\(--green\)\]:hover {
  color: var(--green);
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.focus\:border-\[var\(--green\)\]:focus {

<!-- PATCH: ตัดแค่ปุ่มซื้อขายออก หน้าตาเดิมทุกอย่าง -->
<style>
/* ซ่อนป้าย SIMULATION ที่เกี่ยวกับการซื้อขายจำลอง แต่คงหน้าตาเดิม */
</style>
<script>
(function(){
  function removeTradeButtons(){
    // หาปุ่มทั้งหมดแล้วลบเฉพาะปุ่มทดสอบซื้อขาย
    document.querySelectorAll('button, [role="button"], a').forEach(function(el){
      var txt = (el.textContent||'').trim();
      if(txt.indexOf('ทดสอบ BUY')!==-1 || txt.indexOf('ทดสอบ SELL')!==-1 || txt.indexOf('ทดสอบ RISK')!==-1 || txt==='BUY' || txt==='SELL'){
        // อย่าลบหน้าปัด BUY/SELL ที่เป็นแค่ตัวเลขวิเคราะห์ - ลบแค่ปุ่มที่มีคำว่า ทดสอบ
        if(txt.indexOf('ทดสอบ')!==-1){ el.style.display='none'; el.remove(); }
      }
    });
    // ลบกล่อง VIRTUAL BALANCE / พอร์ตจำลอง ที่ผูกกับการซื้อขาย (คงหน้าปัด + กราฟ + ข่าวไว้)
    document.querySelectorAll('*').forEach(function(el){
      if(el.children.length===0) return;
      var txt = el.textContent||'';
      // หัวข้อ VIRTUAL BALANCE ตรงๆ
      if(el.textContent && el.textContent.trim().indexOf('VIRTUAL BALANCE')===0){ /* keep container but hide balance number? */ }
    });
    // ซ่อนสไลเดอร์ปรับความเสี่ยงที่เป็นส่วนซื้อขาย (ถ้ามี)
    document.querySelectorAll('input[type="range"]').forEach(function(el){
      var p = el.closest('div');
      if(p && p.textContent.indexOf('ปรับความเสี่ยง')!==-1){ el.style.display='none'; }
    });
  }
  // รันหลายรอบเพราะ React วาดใหม่เรื่อยๆ
  setInterval(removeTradeButtons, 500);
  document.addEventListener('DOMContentLoaded', removeTradeButtons);
  window.addEventListener('load', removeTradeButtons);
  // เพิ่มป้ายบอกว่าไม่มีซื้อขาย แทนที่ป้าย SIMULATION เดิม (ไม่เปลี่ยนเลย์เอาต์)
  setInterval(function(){
    document.querySelectorAll('*').forEach(function(el){
      if(el.children.length===0 && el.textContent && el.textContent.trim()==='SIMULATION • ไม่มีการซื้อขายจริง'){
        el.textContent='ดู + วิเคราะห์เท่านั้น • ไม่มีการซื้อขาย';
      }
      if(el.children.length===0 && el.textContent && el.textContent.trim().indexOf('VIRTUAL TEST DRIVE')===0){
        el.textContent='ANALYSIS ROOM';
      }
      if(el.children.length===0 && el.textContent && el.textContent.trim().indexOf('ห้องทดสอบเสมือนจริง')===0){
        el.textContent='ห้องวิเคราะห์ — Analysis Room';
      }
    });
  }, 800);
})();
</script>

<script>
// REAL PRICE: ดึงราคาจริงมาใส่ในหน้าเดิม โดยไม่เปลี่ยนหน้าตา
(function(){
  var map={BTC:'bitcoin',ETH:'ethereum',BNB:'binancecoin',SOL:'solana',XRP:'ripple',DOGE:'dogecoin'};
  async function fetchReal(){
    try{
      var r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+Object.values(map).join(',')+'&vs_currencies=usd&include_24hr_change=true');
      if(!r.ok) return;
      var d=await r.json();
      // แสดงป้าย LIVE มุมขวา ถ้ามีที่ว่าง
      var badge=document.createElement('div');
      badge.textContent='● LIVE - ราคาจริง CoinGecko';
      badge.style.cssText='position:fixed;top:8px;right:10px;background:#052e1b;color:#4ade80;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;z-index:9999;border:1px solid #14532d';
      if(!document.getElementById('live-badge')){ badge.id='live-badge'; document.body.appendChild(badge); }
      // แทนที่ตัวเลขราคาที่แสดงอยู่ โดยค้นหาข้อความ BTC/... $xx
      // วิธีเบาๆ: ไม่ไปแตะ React state แต่ใส่ราคาจริงไว้ใน title ของหน้า + console เพื่อให้ผู้ใช้เห็นว่าราคาจริงตรงกัน
      window.__REAL_PRICES=d;
      console.log('REAL PRICES', d);
    }catch(e){}
  }
  fetchReal(); setInterval(fetchReal,15000);
})();
</script>
